services:
  backend:
    build: .
    container_name: my_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: my_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: